name: Build and Upload SDK

on:
  push:
    branches:
      - "[0-9]+"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (e.g., 2)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload-amd64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["amd64"]'
      platform-flag: "--build-for"
      ref: ${{ github.event.inputs.branch || github.ref }}
      risk: "stable"
      # Track 1 is also released to latest/stable until 2.x becomes the default.
      promote-to-latest: ${{ (github.event.inputs.branch || github.ref_name) == '1' }}
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
  build-and-upload-arm64:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["arm64"]'
      platform-flag: "--build-for"
      runs-on: '["self-hosted-linux-arm64-noble-xlarge"]'
      ref: ${{ github.event.inputs.branch || github.ref }}
      risk: "stable"
      # Track 1 is also released to latest/stable until 2.x becomes the default.
      promote-to-latest: ${{ (github.event.inputs.branch || github.ref_name) == '1' }}
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
