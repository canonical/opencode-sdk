name: opencode
adopt-info: opencode
title: The OpenCode SDK
build-base: ubuntu@26.04
summary: The OpenCode SDK.
description: |
  This SDK provides OpenCode for AI-assisted coding within a workshop.
  The OpenCode binary is sandboxed in the workshop container. Configuration
  and application data are persisted between workshop updates.
license: MIT
website: https://github.com/canonical/opencode-sdk
platforms:
  amd64:
    build-on: [amd64, arm64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

plugs:
  opencode-data:
    interface: mount
    workshop-target: /home/workshop/.local/share/opencode

  opencode-config:
    interface: mount
    workshop-target: /home/workshop/.config/opencode

  # Opt-in access to the host desktop session, including the clipboard.
  desktop:

parts:
  opencode:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - jq
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"
      MAJOR="${VERSION%%.*}"

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) ARCH=x64  ;;
        arm64) ARCH=arm64  ;;
        *)            echo "Unsupported arch: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac

      if [ "$MAJOR" = "1" ]; then
        # OpenCode 1.x ships as GitHub release assets with a sha256 digest.
        RELEASE_API="https://api.github.com/repos/anomalyco/opencode/releases/tags/v${VERSION}"
        ASSET="opencode-linux-${ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/anomalyco/opencode/releases/download/v${VERSION}/${ASSET}"

        echo "Fetching release manifest for v${VERSION}..."
        MANIFEST="$(mktemp)"
        trap 'rm -f "$MANIFEST"' EXIT
        curl -fsSL "$RELEASE_API" -o "$MANIFEST"

        CHECKSUM="$(jq -r --arg name "$ASSET" \
          '.assets[] | select(.name==$name) | .digest | sub("^sha256:"; "")' "$MANIFEST")"

        if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
          echo "Invalid or missing checksum for ${ASSET}" >&2
          exit 1
        fi
        ACTUAL_CMD=sha256sum
      elif [ "$MAJOR" = "2" ]; then
        # OpenCode 2.x is not published as GitHub release assets; it ships as
        # per-platform npm packages verified by the registry's sha512 integrity.
        PACKAGE="@opencode/cli-linux-${ARCH}"
        ASSET="cli-linux-${ARCH}.tgz"

        echo "Fetching npm metadata for ${PACKAGE}@${VERSION}..."
        MANIFEST="$(mktemp)"
        trap 'rm -f "$MANIFEST"' EXIT
        curl -fsSL "https://registry.npmjs.org/${PACKAGE}/${VERSION}" -o "$MANIFEST"

        DOWNLOAD_URL="$(jq -r '.dist.tarball' "$MANIFEST")"
        CHECKSUM="$(jq -r '.dist.integrity | select(startswith("sha512-")) | sub("^sha512-"; "")' "$MANIFEST" \
          | base64 -d | od -An -vtx1 | tr -d ' \n')"

        if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{128}$'; then
          echo "Invalid or missing sha512 integrity for ${PACKAGE}@${VERSION}" >&2
          exit 1
        fi
        ACTUAL_CMD=sha512sum
      else
        echo "Unsupported OpenCode major version: ${VERSION}" >&2
        exit 1
      fi

      echo "Downloading ${DOWNLOAD_URL}..."
      curl -fsSL -o "$CRAFT_PART_SRC/${ASSET}" "$DOWNLOAD_URL"

      ACTUAL="$($ACTUAL_CMD "$CRAFT_PART_SRC/${ASSET}" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/${ASSET}"
        exit 1
      fi

      echo "Checksum OK. Extracting..."
      tar -xzf "$CRAFT_PART_SRC/${ASSET}" -C "$CRAFT_PART_SRC"
      rm "$CRAFT_PART_SRC/${ASSET}"
      # npm tarballs nest the binary under package/bin/.
      if [ -f "$CRAFT_PART_SRC/package/bin/opencode" ]; then
        mv "$CRAFT_PART_SRC/package/bin/opencode" "$CRAFT_PART_SRC/opencode"
        rm -rf "$CRAFT_PART_SRC/package"
      fi
    override-build: |
      install -Dm755 "$CRAFT_PART_SRC/opencode" "$CRAFT_PART_INSTALL/bin/opencode"
      # Hooks read this to apply major-version specific setup.
      install -Dm644 "$CRAFT_PROJECT_DIR/VERSION" "$CRAFT_PART_INSTALL/version"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file

  workshop-config:
    plugin: dump
    source: opencode.json
    source-type: file
