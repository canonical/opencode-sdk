summary: workshop restore re-runs setup-base and (re)creates opencode.json

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # Delete the system config as root via lxc so restore has real work to do.
  workshop exec --uid 0 test-opencode -- rm /etc/opencode/opencode.json

  workshop restore

  workshop exec -- test -f /etc/opencode/opencode.json
  workshop exec -- cat /etc/opencode/opencode.json | MATCH '/etc/opencode/instructions/'

debug: |
  workshop exec -- cat /etc/opencode/opencode.json || true
  lxc list || true
