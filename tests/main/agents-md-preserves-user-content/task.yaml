summary: setup-base merges opencode.json preserving existing user config on re-runs

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # The `agents-md` task covers the fresh-install branch of setup-base.
  # Here we cover the merge branch: an existing /etc/opencode/opencode.json
  # gets the SDK's keys merged in, but user-only keys are preserved.

  # Add a user key that is not in the SDK's opencode.json.
  workshop exec -- sh -c 'tmp=$(mktemp) && jq ". * {\"model\": \"my-custom-model\"}" /etc/opencode/opencode.json > "$tmp" && mv "$tmp" /etc/opencode/opencode.json'

  workshop restore

  # User key must still be present after the merge.
  workshop exec -- cat /etc/opencode/opencode.json | MATCH '"my-custom-model"'

  # SDK key must also be present.
  workshop exec -- cat /etc/opencode/opencode.json | MATCH '/etc/opencode/instructions/'

debug: |
  workshop exec -- cat /etc/opencode/opencode.json || true
