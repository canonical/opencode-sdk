summary: setup-base installs the workshop prompt to the system instructions dir

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # setup-base installs the workshop prompt to the system-managed instructions
  # directory and writes opencode.json so OpenCode loads it for every user.
  workshop exec -- test -f /etc/opencode/instructions/workshop-prompt.md
  workshop exec -- head -1 /etc/opencode/instructions/workshop-prompt.md | \
    MATCH "Workshop Container Environment Instructions"
  workshop exec -- test -f /etc/opencode/opencode.json
  workshop exec -- cat /etc/opencode/opencode.json | \
    MATCH "/etc/opencode/instructions/"

debug: |
  workshop exec -- ls -la /etc/opencode/ || true
  workshop exec -- cat /etc/opencode/opencode.json || true
  workshop exec -- head -5 /etc/opencode/instructions/workshop-prompt.md || true
