summary: opencode is on $PATH inside the workshop

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # `workshop exec` runs as the `workshop` user with a login shell,
  # which is what setup-base configures via /etc/profile.d/opencode.sh.
  workshop exec -- which opencode | MATCH "/opencode$"

debug: |
  workshop exec -- printenv PATH || true
  workshop exec -- ls -l /etc/profile.d/opencode.sh || true
